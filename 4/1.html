<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>canvas{border:1px solid #666;}</style>
</head>
<body>
<canvas id="c" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

// 编译shader工具
function createShader(type,src){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;
}
function createProgram(vs,fs){
    const p=gl.createProgram();
    gl.attachShader(p,createShader(gl.VERTEX_SHADER,vs));
    gl.attachShader(p,createShader(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(p);
    return p;
}

// 顶点着色器：2D正交，直接传屏幕坐标
const vs = `
attribute vec2 aPos;
attribute vec2 aUv;
uniform mat3 uOrtho;
varying vec2 vUv;
void main(){
    gl_Position = vec4(uOrtho * vec3(aPos,1.0), 1.0);
    vUv = aUv;
}
`;

// 片元着色器：做倒影 + 水波扰动 + 垂直透明度衰减
const fs = `
precision mediump float;
uniform sampler2D uTex;
uniform float uTime;
varying vec2 vUv;

float noise(vec2 p){
    return fract(sin(dot(p,vec2(12.9898,78.233))) * 43758.5453);
}

void main(){
    vec2 uv = vUv;
    // 垂直翻转 uv，实现倒影
    uv.y = 1.0 - uv.y;

    // 水波扰动
    float nx = noise(uv*6.0 + uTime*0.15);
    float ny = noise(uv*6.2 - uTime*0.11);
    uv.x += (nx - 0.5) * 0.025;
    uv.y += (ny - 0.5) * 0.01;

    vec4 col = texture2D(uTex, uv);
    // 越往下倒影越透明
    float alpha = 1.0 - vUv.y;
    gl_FragColor = vec4(col.rgb, col.a * alpha * 0.55);
}
`;
const prog = createProgram(vs,fs);

// 正交矩阵 简单2D [-1,1]映射画布
function ortho2D(w,h){
    return new Float32Array([
        2/w,0,0,
        0,-2/h,0,
        -1,1,1
    ]);
}

// ------------ 创建一张测试纹理（红色方块，模拟你的2D精灵）------------
function createTestTexture(){
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.canvas.width=128; ctx.canvas.height=128;
    ctx.fillStyle="#ff5050";
    ctx.fillRect(20,20,88,88);
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,ctx.canvas);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    return t;
}
const tex = createTestTexture();

// 四边形：绘制倒影，放在原图下方
// x,y 屏幕像素; uv 0~1
const quadData = new Float32Array([
    220,200, 0,0,
    348,200, 1,0,
    348,320, 1,1,
    220,200, 0,0,
    348,320, 1,1,
    220,320, 0,1
]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,quadData,gl.STATIC_DRAW);

let time=0;
function render(){
    time +=0.016;
    gl.clearColor(0.15,0.18,0.22,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);

    const ortho = ortho2D(canvas.width,canvas.height);
    gl.uniformMatrix3fv(gl.getUniformLocation(prog,"uOrtho"),false,ortho);
    gl.uniform1f(gl.getUniformLocation(prog,"uTime"),time);

    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    const aPos = gl.getAttribLocation(prog,"aPos");
    const aUv = gl.getAttribLocation(prog,"aUv");
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,16,0);
    gl.enableVertexAttribArray(aUv);
    gl.vertexAttribPointer(aUv,2,gl.FLOAT,false,16,8);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.uniform1i(gl.getUniformLocation(prog,"uTex"),0);

    gl.drawArrays(gl.TRIANGLES,0,6);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
